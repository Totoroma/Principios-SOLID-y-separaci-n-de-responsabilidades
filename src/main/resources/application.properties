spring.application.name=integracion-stock
server.port=8080
sistema-b.base-url=http://localhost:3000
sistema-b.api-key=demo-key
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.datasource.url=jdbc:h2:file:./integracion-stock;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.task.scheduling.pool.size=2
integracion.outbox.max-attempts=5
integracion.outbox.initial-delay-ms=5000
integracion.outbox.max-delay-ms=300000
integracion.outbox.stale-processing-ms=120000
integracion.outbox.poll-interval-ms=5000
sistema-c.base-url=http://localhost:4000
sistema-c.ventas-path=/api/estadisticas/ventas
integracion.statistics-outbox.poll-interval-ms=5000